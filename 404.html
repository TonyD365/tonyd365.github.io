    (() => {
      const routes = {
        "/projects": "/Projects/",
        "/projects/ytktv": "/Projects/YTKTV/",
        "/projects/lanpair": "/Projects/lanpair/",
        "/blog": "/Blog/",
        "/contact": "/Contact/",

    })();
  </script>
